name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` runs every JUnit test under src/test (unit + Spring context tests).
      - name: Build and test
        run: ./mvnw -B verify

      - name: Test summary
        if: always()
        run: |
          shopt -s nullglob
          reports=(target/surefire-reports/TEST-*.xml)
          if [ ${#reports[@]} -eq 0 ]; then
            echo "No test reports found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Test results"
            echo "| Suite | Tests | Failures | Errors | Skipped |"
            echo "|---|---|---|---|---|"
            for f in "${reports[@]}"; do
              head -n 5 "$f" | grep -o '<testsuite [^>]*>' | head -n 1 | awk '{
                match($0, /name="[^"]*"/);     n=substr($0, RSTART+6, RLENGTH-7)
                match($0, /tests="[0-9]+"/);   t=substr($0, RSTART+7, RLENGTH-8)
                match($0, /failures="[0-9]+"/); fl=substr($0, RSTART+10, RLENGTH-11)
                match($0, /errors="[0-9]+"/);  e=substr($0, RSTART+8, RLENGTH-9)
                match($0, /skipped="[0-9]+"/); s=substr($0, RSTART+9, RLENGTH-10)
                printf "| %s | %s | %s | %s | %s |\n", n, t, fl, e, s }'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
