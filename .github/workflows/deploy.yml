name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; let a running one finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  ARTIFACT_KEY: campushub-backend/${{ github.sha }}.jar
  # Non-secret app settings, written to /opt/campushub/app.env on every deploy.
  # Change them in Settings -> Secrets and variables -> Actions -> Variables (true/false).
  DEMO_DATA: ${{ vars.CAMPUSHUB_DEMO_DATA || 'true' }}
  COOKIE_SECURE: ${{ vars.CAMPUSHUB_COOKIE_SECURE || 'false' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # AWS keys live in this environment's secrets; the environment only allows the main branch.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload jar to S3
        run: |
          JAR=$(ls target/campushub-backend-*.jar)
          aws s3 cp "$JAR" "s3://$S3_BUCKET/$ARTIFACT_KEY"

      - name: Deploy on EC2 via SSM Run Command
        run: |
          # The settings end up inside a shell script: accept only true/false.
          for v in "$DEMO_DATA" "$COOKIE_SECURE"; do
            case "$v" in true|false) ;; *) echo "CAMPUSHUB_* variables must be true or false, got: $v"; exit 1 ;; esac
          done

          # Script executed on the instance as root.
          cat > remote.sh <<EOF
          set -eu

          # --- App settings in /opt/campushub/app.env (read by systemd) ---
          ENV=/opt/campushub/app.env
          touch "\$ENV" && chmod 600 "\$ENV"
          # Access-token signing key: generated once ON the instance, so it never travels through
          # GitHub or the SSM command history. Kept on later deploys (a new key would log everyone out).
          grep -q '^CAMPUSHUB_JWT_SECRET=' "\$ENV" || echo "CAMPUSHUB_JWT_SECRET=\$(openssl rand -base64 48)" >> "\$ENV"
          grep -q '^CAMPUSHUB_DB_URL=' "\$ENV" || echo 'CAMPUSHUB_DB_URL=jdbc:h2:file:/opt/campushub/data/campushub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH' >> "\$ENV"
          # Settings from GitHub variables: replaced on every deploy.
          for kv in CAMPUSHUB_DEMO_DATA=$DEMO_DATA CAMPUSHUB_COOKIE_SECURE=$COOKIE_SECURE; do
            sed -i "/^\${kv%%=*}=/d" "\$ENV"
            echo "\$kv" >> "\$ENV"
          done
          # H2 database file; survives deploys (only app.jar is replaced).
          mkdir -p /opt/campushub/data
          chown campushub:campushub /opt/campushub/data
          chmod 700 /opt/campushub/data
          echo "app.env keys: \$(cut -d= -f1 "\$ENV" | tr '\n' ' ')"

          # --- New jar ---
          aws s3 cp "s3://$S3_BUCKET/$ARTIFACT_KEY" /opt/campushub/app.jar.new
          chown campushub:campushub /opt/campushub/app.jar.new
          mv /opt/campushub/app.jar.new /opt/campushub/app.jar
          systemctl restart campushub
          for i in \$(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health; then echo; echo "Healthy"; exit 0; fi
            sleep 2
          done
          echo "Health check failed"
          journalctl -u campushub -n 100 --no-pager
          exit 1
          EOF

          jq -n --rawfile script remote.sh '{commands: [$script]}' > params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 600 \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $COMMAND_ID"

          # Poll until the command finishes (up to ~5 min).
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 5 ;;
              *) break ;;
            esac
          done

          echo "----- stdout -----"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" --query StandardOutputContent --output text
          echo "----- stderr -----"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" --query StandardErrorContent --output text

          echo "Final status: $STATUS"
          [ "$STATUS" = "Success" ]
