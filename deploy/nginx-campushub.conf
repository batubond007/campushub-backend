# /etc/nginx/conf.d/campushub.conf
# Frontend static files from /var/www/campushub/current (symlink to the active release),
# /api/* proxied to the Spring Boot backend on localhost:8080.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/campushub/current;
    index index.html;

    # Backend. Only /api is exposed; /actuator stays reachable from localhost only.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed file names -> cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Always revalidate the entry page so new deploys show up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: unknown paths get index.html (for client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
