spring.application.name=campushub-backend

# --- Database, schema by Flyway (src/main/resources/db/migration) ---
# Default: H2 in a file (locally ./data/campushub.mv.db; on the server /opt/campushub/data).
# MODE=PostgreSQL keeps the SQL PostgreSQL-compatible: for PostgreSQL (e.g. AWS RDS) only these three
# settings change, e.g. CAMPUSHUB_DB_URL=jdbc:postgresql://<endpoint>:5432/campushub (see README "Database").
spring.datasource.url=${CAMPUSHUB_DB_URL:jdbc:h2:file:./data/campushub;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${CAMPUSHUB_DB_USERNAME:sa}
spring.datasource.password=${CAMPUSHUB_DB_PASSWORD:}
# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# --- Errors: RFC 9457 Problem Details for Spring's own errors too (see ApiExceptionHandler) ---
spring.mvc.problemdetails.enabled=true

# --- CampusHub ---
# The default is for local development only; the server sets CAMPUSHUB_JWT_SECRET (32+ random bytes).
campushub.jwt.secret=${CAMPUSHUB_JWT_SECRET:dev-only-secret-do-not-use-in-production-0123456789}
campushub.jwt.access-token-ttl=15m

# Sign-up (US-01): exact domain match only, no subdomains (same rule as the frontend).
campushub.allowed-domains=metu.edu.tr

# E-mail verification codes (US-02). No e-mail is sent yet: codes go to the log, and with a fixed code
# (default 123456, like the frontend mock) every code is the same. CAMPUSHUB_OTP_FIXED_CODE= (empty) -> random codes.
campushub.otp.fixed-code=${CAMPUSHUB_OTP_FIXED_CODE:123456}
campushub.otp.ttl=10m
campushub.otp.max-attempts=5
campushub.otp.resend-cooldown=60s

# Ready-made demo accounts (password Demo1234), same as the mock. CAMPUSHUB_DEMO_DATA=false turns them off.
campushub.demo-data.enabled=${CAMPUSHUB_DEMO_DATA:true}

# Sessions (US-03): refresh token in an httpOnly cookie. Secure stays false while the site is plain HTTP
# (browsers drop Secure cookies over http, so every reload would log out); set CAMPUSHUB_COOKIE_SECURE=true with HTTPS.
campushub.auth.refresh-token-ttl=7d
campushub.auth.refresh-cookie.name=campushub_refresh
campushub.auth.refresh-cookie.path=/api/auth
campushub.auth.refresh-cookie.secure=${CAMPUSHUB_COOKIE_SECURE:false}
