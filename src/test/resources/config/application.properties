# Tests: a fresh in-memory database per test context (overrides src/main/resources/application.properties).
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
campushub.jwt.secret=test-secret-for-unit-tests-only-0123456789abcdef
# Tests create the data they need; DemoDataTest switches demo data on.
campushub.demo-data.enabled=false
campushub.otp.fixed-code=123456
